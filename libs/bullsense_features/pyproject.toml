[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hft_features"
version = "0.2.0"
description = "Order-book and message feature library for MFTFormer"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.19.0",
]

# Discover every subpackage. The upstream manifest declared
# `packages = ["hft_features"]`, which shipped the top-level package only and
# silently dropped categories/ and core/ from any non-editable install.
[tool.setuptools.packages.find]
include = ["hft_features*"]
